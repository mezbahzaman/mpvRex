name: Make release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing tag to publish
        required: true
        type: string

jobs:
  release-for-github:
    if: ${{ !endsWith(github.ref_name, '-patched') && !contains(github.ref_name, '-preview.') && !contains(github.ref_name, '-debug.') }}
    name: "Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > mpvrex-release.keystore
          ./gradlew assembleRelease --stacktrace \
            -PreleaseKeyStore="$PWD/mpvrex-release.keystore" \
            -PreleaseKeyStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias=mpvrex \
            -PreleaseKeyPassword="$KEY_PASSWORD"
          rm mpvrex-release.keystore

      - name: Get tag name
        env:
          REQUESTED_TAG: ${{ inputs.version_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="$REQUESTED_TAG"
          fi
          git rev-parse --verify "refs/tags/$VERSION_TAG"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"

      - name: Verify build output
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Release directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          ls -lah "$RELEASE_DIR"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          RELEASE_DIR="app/build/outputs/apk/release"
          shopt -s nullglob
          apks=("$RELEASE_DIR"/app-*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No signed APK files found"
            ls -lah "$RELEASE_DIR"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          done
          ls -lh "${apks[@]}"

      - name: Copy build artifacts
        run: |
          set -euo pipefail
          RELEASE_DIR="app/build/outputs/apk/release"
          shopt -s nullglob
          apks=("$RELEASE_DIR"/app-*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No signed APK files found"
            exit 1
          fi
          for src in "${apks[@]}"; do
            abi="${src##*/app-}"
            abi="${abi%-release.apk}"
            dst="mpvRex-${abi}-${VERSION_TAG}.apk"
            cp "$src" "$dst"
            checksum=$(sha256sum "$dst" | cut -d' ' -f1)
            varname="apk_${abi//-/_}_sha256"
            echo "$varname=$checksum" >> "$GITHUB_ENV"
          done
          ls -lah mpvRex-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpvRex ${{ env.VERSION_TAG }}
          body: |
            ---
            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | arm64-v8a | ${{ env.apk_arm64_v8a_sha256 }} |
          files: |
            mpvRex-*-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

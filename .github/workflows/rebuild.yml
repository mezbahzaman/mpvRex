name: Build patched mpvRex (stable, arm64, auto-update)

# Rebuilds the patched mpvRex on top of the latest upstream MASTER commit.
# Runs daily, plus on demand. Skips automatically when the current upstream
# commit was already built and published.
# Requires repo secrets: RELEASE_KEYSTORE_B64 (base64 of mpvrex-release.keystore),
# KEYSTORE_PASSWORD, KEY_PASSWORD.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patched
          fetch-depth: 0
          fetch-tags: true

      - name: Find latest upstream master
        id: base
        run: |
          git remote add upstream https://github.com/sfsakhawat999/mpvRex
          timeout 300 git fetch upstream master 2>/dev/null || echo "fetch failed - continuing"
          BASE=$(git rev-parse upstream/master 2>/dev/null || git rev-parse HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Upstream master: $(git rev-parse --short $BASE)"

      - name: Skip if this upstream commit was already built
        id: existing
        env:
          BASE: ${{ steps.base.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body' 2>/dev/null || true)
          if echo "$REL" | grep -q "Upstream: $BASE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release already built from upstream $BASE - nothing to do."
          else
            echo "No matching release yet - rebuilding."
          fi

      - name: Apply Stremio patch on latest upstream
        if: steps.existing.outputs.skip != 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          cp patched.patch /tmp/patched.patch
          cp .github/workflows/rebuild.yml /tmp/rebuild.yml
          cp RELEASE_NOTES.md /tmp/RELEASE_NOTES.md
          git checkout -B patched "$BASE"
          git reset --hard "$BASE"
          git apply --3way /tmp/patched.patch
          if ! grep -q '"-stable"' app/build.gradle.kts; then
            sed -i 's/versionName = "\([^"]*\)"/versionName = "\1-stable"/' app/build.gradle.kts
          fi
          mkdir -p .github/workflows
          cp /tmp/rebuild.yml .github/workflows/rebuild.yml
          cp /tmp/patched.patch patched.patch
          cp /tmp/RELEASE_NOTES.md RELEASE_NOTES.md
          git config user.name patcher
          git config user.email patcher@local
          git add -A
          git commit -m "Apply Stremio stable patch on $BASE" || true
          git push -f origin patched

      - name: Setup JDK
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.existing.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        if: steps.existing.outputs.skip != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true

      - name: Setup Gradle cache
        if: steps.existing.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        if: steps.existing.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > mpvrex-release.keystore

      - name: Build APK
        if: steps.existing.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain :app:assembleRelease \
            -PreleaseKeyStore="$PWD/mpvrex-release.keystore" \
            -PreleaseKeyStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias=mpvrex \
            -PreleaseKeyPassword="$KEY_PASSWORD"

      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          cp "app/build/outputs/apk/release/app-arm64-v8a-release.apk" "mpvRex-${VER}-arm64-v8a-stremio-sync-patched.apk"
          if gh release view "v${VER}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "v${VER}" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          { cat RELEASE_NOTES.md; echo ""; echo "Upstream: $BASE"; echo "Auto-built from upstream mpvRex master \`$(echo $BASE | cut -c1-7)\` with the Stremio patch. Auto-updates from this fork (api.github.com/repos/mezbahzaman/mpvRex/releases/latest). Install with: adb install -r (same signature, keeps data)."; } > /tmp/notes.md
          gh release create "v${VER}" "mpvRex-${VER}-arm64-v8a-stremio-sync-patched.apk" \
            --repo "${{ github.repository }}" \
            --title "mpvRex-Stable $VER (patched)" \
            --notes-file /tmp/notes.md

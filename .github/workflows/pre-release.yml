name: Make Pre release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*-preview.*'
      - 'v*-debug.*'

jobs:
  release-for-github:
    name: "Preview Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew assemblePreview --stacktrace

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          if [[ "$VERSION_TAG" == *-debug.* ]]; then
            echo "RELEASE_NAME=mpvRex $VERSION_TAG Debug" >> "$GITHUB_ENV"
          else
            echo "RELEASE_NAME=mpvRex $VERSION_TAG" >> "$GITHUB_ENV"
          fi

      - name: Verify build output
        run: |
          PREVIEW_DIR="app/build/outputs/apk/preview"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Preview directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          ls -lah "$PREVIEW_DIR"

      - name: Prepare unsigned debug APKs
        run: |
          set -euo pipefail
          PREVIEW_DIR="app/build/outputs/apk/preview"
          shopt -s nullglob
          apks=("$PREVIEW_DIR"/app-*-preview-unsigned.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No unsigned preview APKs found"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            mv "$apk" "${apk/-unsigned/}"
          done

      - name: Copy built artifacts
        run: |
          set -euo pipefail
          mkdir -p preview
          shopt -s nullglob
          apks=(app/build/outputs/apk/preview/app-*-preview.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No unsigned preview APKs found"
            exit 1
          fi
          for src in "${apks[@]}"; do
            abi="${src##*/app-}"
            abi="${abi%-preview.apk}"
            cp "$src" "preview/mpvRex-debug-unsigned-${abi}-${VERSION_TAG}.apk"
          done
          (cd preview && sha256sum *.apk > SHA256SUMS.txt)

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ### New feature
            - Added Trakt scrobbling with browser-based OAuth authentication.
            - Reports start, pause, resume, stop, and periodic playback progress to Trakt.
            - Supports confidently identified movies and season/episode filenames, including IMDb IDs when present.

            This is a debug pre-release intended for testing the new integration. Apps connected to the same Trakt account, including Stremio when Trakt integration is enabled there, can consume the reported watch state. Configure your Trakt API client ID and secret under **Settings > Extra Settings > Trakt Scrobbling**. The Trakt application redirect URI must be `mpvrex://trakt-callback`.

            The attached debug APK is intentionally unsigned for this test release.

            SHA-256 checksums are included in the attached `SHA256SUMS.txt` file.
          files: |
            preview/*.apk
            preview/SHA256SUMS.txt
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
